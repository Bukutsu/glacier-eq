[package]
name = "tauri-plugin-hid"
version = "0.2.3"
edition = "2021"
rust-version = "1.77.2"
authors = ["Joseph Birks"]
description = "A Tauri plugin to provide access to USB HID devices"
license = "MIT"
repository = "https://github.com/RedfernElec/tauri-plugin-hid"
links = "tauri-plugin-hid"
build = "build.rs"

[lib]
name = "tauri_plugin_hid"
path = "src/lib.rs"

[dependencies]
serde = "1"
tauri = "2.4.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.1.0", features = ["build"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.hidapi]
version = "2.6.3"
features = ["linux-native"]
default-features = false
