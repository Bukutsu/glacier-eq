name: Bug Report
description: Report a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect DAC
        2. Launch Glacier EQ
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      render: shell
