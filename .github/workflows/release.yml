name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: Desktop build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            rust-targets: ""
            required-assets: "linux-x64"
          - name: windows-x64
            os: windows-latest
            args: "--bundles nsis,msi"
            rust-targets: ""
            required-assets: "windows-x64"
          - name: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust-targets: "aarch64-apple-darwin"
            required-assets: "macos-apple-silicon"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            rust-targets: "x86_64-apple-darwin"
            required-assets: "macos-intel"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "tauri-desktop-${{ matrix.name }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          assetNamePattern: "glacier-eq_[version]_[platform]_[arch].[ext]"

      - name: Collect and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' \
            -o -name '*.app.tar.gz' \
            -o -name '*.AppImage' \
            -o -name '*.AppImage.tar.gz' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.exe' \
            -o -name '*.msi' \
            -o -name '*.nsis.zip' \
            -o -name '*.sig' \) \
            -exec cp '{}' release-assets/ \;

          if ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "❌ No Tauri bundle assets were produced for ${{ matrix.name }}."
            find target -path '*/bundle/*' -type f -print || true
            exit 1
          fi

          case "${{ matrix.required-assets }}" in
            linux-x64)
              compgen -G 'release-assets/*.deb' >/dev/null || { echo '❌ Missing Linux .deb asset'; exit 1; }
              compgen -G 'release-assets/*.rpm' >/dev/null || { echo '❌ Missing Linux .rpm asset'; exit 1; }
              compgen -G 'release-assets/*.AppImage' >/dev/null || { echo '❌ Missing Linux .AppImage asset'; exit 1; }
              ;;
            windows-x64)
              compgen -G 'release-assets/*.msi' >/dev/null || { echo '❌ Missing Windows .msi asset'; exit 1; }
              compgen -G 'release-assets/*.exe' >/dev/null || { echo '❌ Missing Windows .exe asset'; exit 1; }
              ;;
            macos-apple-silicon|macos-intel)
              compgen -G 'release-assets/*.dmg' >/dev/null || { echo '❌ Missing macOS .dmg asset'; exit 1; }
              ;;
            *)
              echo "❌ Unknown required asset group: ${{ matrix.required-assets }}"
              exit 1
              ;;
          esac

          echo "✅ Assets collected for ${{ matrix.name }}:"
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glacier-eq-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and platform
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "platforms;android-36" --sdk_root="$ANDROID_HOME"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "tauri-android"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          npm run android:init
          # Apply our Gradle configuration cache fix (BuildTask/RustPlugin)
          cp -R scripts/android-buildsrc/* src-tauri/gen/android/buildSrc/
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Verify Android themed icon resources
        run: |
          test -f src-tauri/gen/android/app/src/main/res/drawable/ic_launcher_monochrome.xml
          grep -q '<monochrome android:drawable="@drawable/ic_launcher_monochrome"/>' \
            src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Setup Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p src-tauri/gen/android/app
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/glacier-eq.keystore
            cat > src-tauri/gen/android/app/keystore.properties << PROPEOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=glacier-eq
          storeFile=glacier-eq.keystore
          PROPEOF
            echo "Keystore set up from secrets"
          else
            keytool -genkeypair -v \
              -keystore src-tauri/gen/android/app/glacier-eq.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cat > src-tauri/gen/android/app/keystore.properties << PROPEOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=glacier-eq.keystore
          PROPEOF
            echo "No keystore secrets found, using generated debug signing key"
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()
          marker = 'val tauriProperties = Properties().apply {'
          signing = '''val keystoreProperties = Properties().apply {
              val propFile = file("keystore.properties")
              if (propFile.exists()) {
                  propFile.inputStream().use { load(it) }
              }
          }

          '''
          if signing not in text:
              text = text.replace(marker, signing + marker)
          marker = '    buildTypes {'
          config = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
          if config not in text:
              text = text.replace(marker, config + marker)
          marker = '        getByName("release") {'
          line = '            signingConfig = signingConfigs.getByName("release")\n'
          if line not in text:
              text = text.replace(marker, marker + '\n' + line)
          path.write_text(text)
          PY

      - name: Build Android APK
        run: npm run android:apk:release

      - name: Collect and verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p release-assets

          apk_paths=( src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk )
          if [[ ${#apk_paths[@]} -eq 0 ]]; then
            apk_paths=( src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk )
          fi
          if [[ ${#apk_paths[@]} -eq 0 ]]; then
            apk_paths=( src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk )
          fi
          if [[ ${#apk_paths[@]} -eq 0 ]]; then
            find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            echo "❌ No Android APK found" >&2
            exit 1
          fi

          apk="${apk_paths[0]}"
          version="${{ github.ref_name }}"
          version="${version#v}"
          version="${version//\//-}"
          cp "$apk" "release-assets/glacier-eq_v${version}_android-arm64.apk"

          compgen -G 'release-assets/*_android-arm64.apk' >/dev/null || { echo '❌ Missing Android APK asset'; exit 1; }
          echo "✅ Android asset collected:"
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glacier-eq-android-apk
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create release and upload assets
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            echo "Update src-tauri/Cargo.toml, src-tauri/tauri.conf.json, and package.json before tagging."
            exit 1
          fi
          echo "✅ Version check passed: $TAG_VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: glacier-eq-*
          merge-multiple: true

      - name: Verify release asset coverage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Release assets downloaded:"
          find artifacts -maxdepth 1 -type f -print | sort

          require_glob() {
            local label="$1"
            local pattern="$2"
            if ! compgen -G "$pattern" >/dev/null; then
              echo "❌ Missing required release asset: $label ($pattern)"
              exit 1
            fi
          }

          require_glob "Linux DEB" 'artifacts/*.deb'
          require_glob "Linux RPM" 'artifacts/*.rpm'
          require_glob "Linux AppImage" 'artifacts/*.AppImage'
          require_glob "Windows MSI" 'artifacts/*.msi'
          require_glob "Windows EXE" 'artifacts/*.exe'
          require_glob "macOS Apple Silicon DMG" 'artifacts/*aarch64*.dmg'
          if ! compgen -G 'artifacts/*x64*.dmg' >/dev/null && ! compgen -G 'artifacts/*x86_64*.dmg' >/dev/null; then
            echo "❌ Missing required release asset: macOS Intel DMG"
            exit 1
          fi
          require_glob "Android ARM64 APK" 'artifacts/*android-arm64.apk'

          echo "✅ All expected OS release assets are present."

      - name: Create release and upload verified assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Glacier EQ ${{ github.ref_name }}"
          body: "Automated Glacier EQ build. See assets below for installers."
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
