name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: Desktop build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: windows-x64
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: macos-apple-silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          assetNamePattern: "glacier-eq_[version]_[platform]_[arch].[ext]"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glacier-eq-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.appimage.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.nsis.zip
            src-tauri/target/release/bundle/**/*.nsis.zip.sig
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig
          retention-days: 90

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and platform
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "platforms;android-36" --sdk_root="$ANDROID_HOME"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run android:apk:release

      - name: Rename APK to release convention
        run: |
          shopt -s globstar nullglob
          apk_paths=( src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk )
          if [[ ${#apk_paths[@]} -eq 0 ]]; then
            apk_paths=( src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk )
          fi
          if [[ ${#apk_paths[@]} -eq 0 ]]; then
            apk_paths=( src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk )
          fi
          if [[ ${#apk_paths[@]} -eq 0 ]]; then
            find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            echo "No APK found" >&2
            exit 1
          fi
          apk="${apk_paths[0]}"
          dir="$(dirname "$apk")"
          version="${{ github.ref_name }}"
          version="${version#v}"
          mv "$apk" "$dir/glacier-eq_v${version}_android-arm64.apk"

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: glacier-eq-android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/glacier-eq_*_android-arm64.apk
          retention-days: 90

  release:
    name: Create release and upload assets
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            echo "Update src-tauri/Cargo.toml, src-tauri/tauri.conf.json, and package.json before tagging."
            exit 1
          fi
          echo "✅ Version check passed: $TAG_VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: glacier-eq-*

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Glacier EQ ${{ github.ref_name }}"
          body: "Automated Glacier EQ build. See assets below for installers."
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true

      - name: Upload all assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          for file in artifacts/**/*; do
            [ -f "$file" ] && gh release upload "${{ github.ref_name }}" "$file" --clobber --repo "${{ github.repository }}"
          done
