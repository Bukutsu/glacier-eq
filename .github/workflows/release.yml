name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-tag:
    name: Verify tag and manifests
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.version }}
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Without the key every desktop build fails late, after compiling.
          # Installed apps accept updates only if signed by the matching key.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "❌ Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets."
            exit 1
          fi

      - name: Verify tag matches Cargo.toml version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TAG_VERSION="${RELEASE_VERSION%%-*}"
          if [[ "$RELEASE_VERSION" == *-* && ! "$RELEASE_VERSION" =~ ^${TAG_VERSION}-([1-9]|alpha(\.[1-9])?|beta(\.[1-9])?|rc(\.[1-9])?)$ ]]; then
            echo "❌ Unsupported prerelease suffix"
            exit 1
          fi
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match one or more release manifests"
            echo "Update src-tauri/Cargo.toml, src-tauri/tauri.conf.json, and package.json before tagging."
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Version check passed: $TAG_VERSION"

  verify:
    name: Verify locked source and tests
    needs: [check-tag]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      # The build jobs below already cache, so without this the verify gate
      # recompiled the whole workspace cold on every run: 182s of the 265s job.
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: glacier-core|src-tauri|tauri-plugin-hid|tauri-plugin-material-you

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            minisign

      - name: Install frontend dependencies
        run: npm ci

      # A present but mismatched private key would make every update signature
      # unusable by installed apps. Sign a throwaway challenge and verify it
      # against the public key baked into the app before building release assets.
      - name: Verify updater signing key matches the embedded public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          challenge=$(mktemp)
          signature="$challenge.minisig"
          trap 'rm -f "$challenge" "$challenge.sig" "$signature"' EXIT
          printf 'Glacier EQ updater key check\n' > "$challenge"
          npx tauri signer sign "$challenge" >/dev/null
          base64 --decode "$challenge.sig" > "$signature"
          public_key=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey)')
          public_key=$(printf '%s' "$public_key" | base64 --decode | tail -n 1)
          minisign -Vm "$challenge" -x "$signature" -P "$public_key"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Same entry point contributors run, so CI cannot drift from local.
      - name: Verify frontend
        run: npm run verify

      - name: Verify Rust
        run: npm run verify:rust

  desktop:
    name: Desktop build (${{ matrix.name }})
    # Deliberately not gated on `verify`: the builds already run in parallel, so
    # waiting for a 4-minute gate only adds its duration to the critical path.
    # `release` below requires `verify` too, so nothing is published unless the
    # gate passed.
    needs: [check-tag]
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    env:
      VITE_APP_VERSION: ${{ needs.check-tag.outputs.release-version }}
      GLACIER_EQ_RELEASE_VERSION: ${{ needs.check-tag.outputs.release-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
            rust-targets: ""
            required-assets: "linux-x64"
          - name: windows-x64
            os: windows-latest
            args: "--bundles nsis,msi"
            rust-targets: ""
            required-assets: "windows-x64"
          - name: macos-apple-silicon
            os: macos-latest
            # `app` is bundled alongside the DMG so Tauri also writes the
            # updater's .app.tar.gz; a DMG-only build produces none.
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rust-targets: "aarch64-apple-darwin"
            required-assets: "macos-apple-silicon"
            updater-arch: "aarch64"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rust-targets: "x86_64-apple-darwin"
            required-assets: "macos-intel"
            updater-arch: "x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # zsync provides zsyncmake, which writes the AppImage's .zsync file;
          # appstream provides appstreamcli, which validates its metainfo.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            zsync \
            appstream

      - name: Seed modern linuxdeploy (excludes stale libwayland-client)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          cache_dir="$HOME/.cache/tauri"
          target="$cache_dir/linuxdeploy-x86_64.AppImage"
          mkdir -p "$cache_dir"
          curl -fsSL --retry 3 \
            -o "$target" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $target" | sha256sum -c -
          chmod +x "$target"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: ". -> target"
          shared-key: "tauri-desktop-${{ matrix.name }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Write release version config
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-tag.outputs.release-version }}
        run: |
          set -euo pipefail
          # createUpdaterArtifacts lives here, not in tauri.conf.json, so local
          # and test builds do not need the updater signing key.
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}\n' "$RELEASE_VERSION" > release-config.json

      - name: Check release signing credentials
        id: signing
        if: startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'windows')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            missing=()
            [[ -n "$APPLE_CERTIFICATE" ]] || missing+=(APPLE_CERTIFICATE)
            [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
            [[ -n "$APPLE_SIGNING_IDENTITY" ]] || missing+=(APPLE_SIGNING_IDENTITY)
            if (( ${#missing[@]} > 0 )); then
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "notarized=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=macOS code signing::Unavailable: ${missing[*]}. Building unsigned macOS artifacts."
              exit 0
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ macOS code signing credentials found."

            # Code signing and notarization are separate: Tauri signs with the
            # imported certificate but authenticates to Apple separately. The
            # previous check only looked at the certificate, so a release with
            # no Apple credentials still reported itself as signed and shipped
            # a DMG that Gatekeeper rejects on every user's machine.
            notary_missing=()
            if [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" ]]; then
              notary_missing+=(APPLE_ID+APPLE_PASSWORD)
            fi
            [[ -n "$APPLE_TEAM_ID" ]] || notary_missing+=(APPLE_TEAM_ID)
            if (( ${#notary_missing[@]} > 0 )); then
              echo "notarized=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=macOS notarization::Signed but NOT notarized: missing ${notary_missing[*]}. Every download will show a Gatekeeper warning."
            else
              echo "notarized=true" >> "$GITHUB_OUTPUT"
              echo "✅ macOS notarization credentials found."
            fi
            if [[ -z "$KEYCHAIN_PASSWORD" ]]; then
              echo "::notice title=macOS keychain::KEYCHAIN_PASSWORD is unset; Tauri will generate a temporary one for the certificate import."
            fi
          elif [[ -n "$WINDOWS_CERTIFICATE" && -n "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "✅ Windows signing credentials found."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing credentials are unavailable; building unsigned Windows artifacts."
          fi

      - name: Build Linux app
        if: matrix.os == 'ubuntu-22.04'
        # NOTE: no GITHUB_TOKEN here on purpose. tauri-action would otherwise
        # create its own release (per matrix OS) and collide with the single
        # release published by the `release` job below. It only builds here;
        # bundles are collected as artifacts and published once by softprops.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by linuxdeploy-plugin-appimage (appimagetool). LDAI_VERSION is
          # written to the desktop file as X-AppImage-Version. The update string
          # is embedded in the AppImage's .upd_info section; the file name must
          # match the GitHub release asset <name>.zsync made by "Generate
          # AppImage zsync file". Gear Lever and appimageupdatetool read it.
          LDAI_VERSION: ${{ needs.check-tag.outputs.release-version }}
          # appimagetool wants <desktop name>.appdata.xml; ours is named after
          # its AppStream id, so it checks the tree itself in "Verify AppImage".
          LDAI_NO_APPSTREAM: "1"
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Glacier-EQ_*_amd64.AppImage.zsync"
        with:
          args: ${{ matrix.args }} --config release-config.json -- --locked
          releaseAssetNamePattern: "glacier-eq_[version]_[platform]_[arch].[ext]"
          retryAttempts: 1

      - name: Verify AppImage contents and metadata
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          appimage=$(find target -path '*/bundle/appimage/*.AppImage' -print -quit 2>/dev/null || true)
          if [ -z "$appimage" ]; then
            echo "❌ No AppImage found under target/*/bundle/appimage/"
            exit 1
          fi
          workdir=$(mktemp -d)
          cp "$appimage" "$workdir/app.AppImage"
          chmod +x "$workdir/app.AppImage"
          (cd "$workdir" && ./app.AppImage --appimage-extract >/dev/null)
          found=$(find "$workdir/squashfs-root" -name 'libwayland-client.so*' -print -quit)
          if [ -n "$found" ]; then
            echo "❌ Error: $(basename "$appimage") bundles $found (shadows host Mesa and causes white screen)"
            exit 1
          fi
          echo "✅ Verified: $(basename "$appimage") does not bundle libwayland-client"

          # Gear Lever and Shelly read the version from the desktop entry, and
          # Gear Lever reads update info from the .upd_info ELF section.
          desktop=$(find "$workdir/squashfs-root" -maxdepth 1 -name '*.desktop' -print -quit)
          if ! grep -qx "X-AppImage-Version=$GLACIER_EQ_RELEASE_VERSION" "$desktop"; then
            echo "❌ $(basename "$desktop") lacks X-AppImage-Version=$GLACIER_EQ_RELEASE_VERSION"
            cat "$desktop"
            exit 1
          fi
          if ! readelf --string-dump=.upd_info --wide "$appimage" | grep -qF "gh-releases-zsync|"; then
            echo "❌ $(basename "$appimage") has no embedded update information (.upd_info)"
            exit 1
          fi
          # AppStream metainfo for software centers and AppImage catalogs. It
          # must exist and agree with the desktop file.
          test -f "$workdir/squashfs-root/usr/share/metainfo/com.bukutsu.glaciereq.metainfo.xml"
          appstreamcli validate-tree --no-net "$workdir/squashfs-root"
          rm -rf "$workdir"
          echo "✅ Verified: X-AppImage-Version, update information, and AppStream metainfo"

      - name: Build signed app
        if: matrix.os != 'ubuntu-22.04' && steps.signing.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} --config release-config.json -- --locked
          releaseAssetNamePattern: "glacier-eq_[version]_[platform]_[arch].[ext]"
          retryAttempts: 1

      - name: Build unsigned app
        if: matrix.os != 'ubuntu-22.04' && steps.signing.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} --config release-config.json -- --locked
          releaseAssetNamePattern: "glacier-eq_[version]_[platform]_[arch].[ext]"
          retryAttempts: 1

      - name: Collect and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' \
            -o -name '*.app.tar.gz' \
            -o -name '*.AppImage' \
            -o -name '*.AppImage.tar.gz' \
            -o -name '*.deb' \
            -o -name '*.rpm' \
            -o -name '*.exe' \
            -o -name '*.msi' \
            -o -name '*.nsis.zip' \
            -o -name '*.sig' \) \
            -exec cp '{}' release-assets/ \;

          # Both macOS jobs emit an arch-less Glacier-EQ.app.tar.gz; give each a
          # unique name before the artifacts are merged. The signature covers
          # the bytes, not the name, so the .sig only needs the same rename.
          if [ -n "${{ matrix.updater-arch }}" ]; then
            archive=release-assets/Glacier-EQ.app.tar.gz
            if [ ! -f "$archive" ] || [ ! -f "$archive.sig" ]; then
              echo "❌ Missing signed updater archive: $archive(.sig)"
              exit 1
            fi
            renamed="release-assets/glacier-eq_v${{ needs.check-tag.outputs.release-version }}_macos-${{ matrix.updater-arch }}.app.tar.gz"
            mv "$archive" "$renamed"
            mv "$archive.sig" "$renamed.sig"
          fi

          if ! find release-assets -maxdepth 1 -type f | grep -q .; then
            echo "❌ No Tauri bundle assets were produced for ${{ matrix.name }}."
            find target -path '*/bundle/*' -type f -print || true
            exit 1
          fi

          echo "✅ Assets collected for ${{ matrix.name }}:"
          find release-assets -maxdepth 1 -type f -print | sort

      # Gear Lever's embedded gh-releases-zsync update info points at this file,
      # and it compares its SHA-1 header with the installed AppImage. Made here
      # rather than by appimagetool so it is deterministic and sits beside the
      # AppImage. -u is the relative download URL (the AppImage's own name).
      - name: Generate AppImage zsync file
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          appimage=$(find . -maxdepth 1 -name '*.AppImage' -printf '%f\n')
          if [ "$(printf '%s\n' "$appimage" | grep -c .)" -ne 1 ]; then
            echo "❌ Expected exactly one AppImage, found: $appimage"
            exit 1
          fi
          zsyncmake -u "$appimage" -o "$appimage.zsync" "$appimage"
          grep -a -m1 '^SHA-1: ' "$appimage.zsync"
          echo "✅ Generated $appimage.zsync"

      # The release exe is self-contained (frontend embedded, no resources or
      # sidecars), so zipping it alone gives a portable build. WebView2 must
      # already be installed on the target machine (default on Windows 10/11).
      - name: Package Windows portable build
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/release/glacier-eq.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $dir = 'portable/Glacier-EQ'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe "$dir/Glacier-EQ.exe"
          Copy-Item LICENSE $dir
          $zip = "release-assets/glacier-eq_v${{ needs.check-tag.outputs.release-version }}_windows-x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          Get-Item $zip

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glacier-eq-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android APK
    # Overlaps the verify gate on purpose; see the note on `desktop`.
    needs: [check-tag]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # GitHub-hosted Ubuntu runners ship a full Android SDK at this path.
      # Set explicitly so the build is deterministic regardless of how setup actions mutate env.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VITE_APP_VERSION: ${{ needs.check-tag.outputs.release-version }}
      GLACIER_EQ_RELEASE_VERSION: ${{ needs.check-tag.outputs.release-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: false

      - name: Install pinned Android NDK + platform
        # NOTE: we intentionally do NOT use android-actions/setup-android.
        # That action detects a "wrong version" preinstalled cmdline-tools and runs
        # `sdkmanager tools`, which downloads the Android Emulator — a large package
        # whose download frequently corrupts on runners ("Error reading Zip content").
        # The runner already has cmdline-tools + a preinstalled SDK, so we install
        # only the packages we actually need via the preinstalled sdkmanager.
        # cargo-mobile2 (Tauri) reads ONLY `$NDK_HOME`, never scans the SDK dir,
        # so pointing NDK_HOME at the pinned NDK guarantees it is the one used.
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "No sdkmanager found"; exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          set +e
          yes | "$SDKMANAGER" --install "ndk;26.1.10909125" "platforms;android-36" 2>&1 | tail -8
          sdk_status=${PIPESTATUS[1]}
          set -e
          if [ "$sdk_status" -ne 0 ]; then
            echo "Android SDK installation failed (status $sdk_status)" >&2
            exit "$sdk_status"
          fi
          NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          test -d "$NDK_DIR" || { echo "NDK install failed: $NDK_DIR missing"; exit 1; }
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME"/platforms/android-36 || { echo "android-36 platform missing"; exit 1; }
          echo "NDK + platform ready: $NDK_DIR"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: ". -> target"
          shared-key: "tauri-android"

      - run: npm ci

      - name: Verify Cargo lock is current
        run: cargo metadata --locked --no-deps

      - name: Init Android project and apply the tracked Android overlay (buildSrc + signing fixes)
        run: |
          set -e
          buildtask=src-tauri/gen/android/buildSrc/src/main/java/com/bukutsu/glaciereq/kotlin/BuildTask.kt
          buildtask_backup=$(mktemp)
          cp "$buildtask" "$buildtask_backup"
          trap 'cp "$buildtask_backup" "$buildtask" 2>/dev/null || true; rm -f "$buildtask_backup"' EXIT
          rm -rf src-tauri/gen/android
          npm run android:prepare
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          # Preserve the tracked npm fallback after Tauri regenerates buildSrc.
          cp "$buildtask_backup" "$buildtask"
          # app/build.gradle.kts with release-keystore signing support
          cp scripts/android-app/build.gradle.kts src-tauri/gen/android/app/build.gradle.kts
          wrapper=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          checksum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14
          if grep -q '^distributionSha256Sum=' "$wrapper"; then
            grep -q "^distributionSha256Sum=$checksum$" "$wrapper"
          else
            printf '\ndistributionSha256Sum=%s\n' "$checksum" >> "$wrapper"
          fi
          # NOTE: do NOT modify the generated gradle.properties. It already contains
          # android.useAndroidX=true and JVM args; appending risked concatenating onto
          # a line with no trailing newline ("AndroidX trueorg.gradle.caching=true").
          # Build caching is handled by gradle/actions/setup-gradle@v4.

      - name: Compute Android release version
        id: android-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          raw_version="${RELEASE_TAG#v}"
          base_version="${raw_version%%-*}"
          IFS='.' read -r major minor patch <<< "$base_version"
          # Finals occupy slot 50; prereleases stay below it. Only numeric
          # 1..9 and alpha/beta/rc with an optional .1..9 are accepted so two
          # distinct release tags cannot map to the same versionCode.
          prerelease_code=50
          if [[ "$raw_version" != "$base_version" ]]; then
            pre="${raw_version#*-}"
            if [[ "$pre" =~ ^[1-9]$ ]]; then
              if (( 10#$pre < 1 || 10#$pre > 9 )); then
                echo "Refusing tag: numeric prerelease '$pre' must be in 1..9" >&2
                exit 1
              fi
              prerelease_code=$pre
            elif [[ "$pre" =~ ^(alpha|beta|rc)(\.[1-9])?$ ]]; then
              case "${pre%%.*}" in
                alpha) prerelease_code=10 ;;
                beta) prerelease_code=20 ;;
                rc) prerelease_code=30 ;;
              esac
              if [[ "$pre" == *.* ]]; then
                prerelease_code=$(( prerelease_code + ${pre##*.} ))
              fi
            else
              echo "Refusing tag: prerelease must be 1..9, alpha[.1..9], beta[.1..9], or rc[.1..9]" >&2
              exit 1
            fi
          fi
          # Keep the arithmetic collision-free and below Android's limit.
          if (( major > 2097 || minor > 99 || patch > 99 )); then
            echo "Refusing tag: version components must fit major<=2097, minor<=99, patch<=99" >&2
            exit 1
          fi
          version_code=$(( major*1000000 + minor*10000 + patch*100 + prerelease_code ))
          android_config=$(printf '{"version":"%s","bundle":{"android":{"versionCode":%s}}}' \
            "$raw_version" "$version_code")
          echo "config=$android_config" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Android release version: $raw_version (code $version_code)"

      - name: Setup Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          umask 077
          mkdir -p src-tauri/gen/android/app
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/glacier-eq.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "glacier-eq" "glacier-eq.keystore" \
              > src-tauri/gen/android/app/keystore.properties
            chmod 600 src-tauri/gen/android/app/glacier-eq.keystore src-tauri/gen/android/app/keystore.properties
          else
            echo "KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets are required for release APKs" >&2
            exit 1
          fi

      - name: Build APK
        env:
          ANDROID_CONFIG: ${{ steps.android-version.outputs.config }}
        run: npm exec -- tauri android build --apk --target aarch64 --config "$ANDROID_CONFIG" -- --locked

      - name: Collect APK artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.check-tag.outputs.release-version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null)
          if [ -z "${apk:-}" ]; then echo "No APK found"; exit 1; fi
          metadata="$(dirname "$apk")/output-metadata.json"
          if [ ! -f "$metadata" ]; then echo "No APK metadata found: $metadata"; exit 1; fi
          metadata_values=$(python3 - "$metadata" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              element = json.load(handle)["elements"][0]
          print(f"{element['versionCode']}\t{element['versionName']}")
          PY
          )
          IFS=$'\t' read -r actual_version_code actual_version_name <<< "$metadata_values"
          if [ "$actual_version_code" != "$EXPECTED_VERSION_CODE" ]; then
            echo "Android versionCode mismatch: expected $EXPECTED_VERSION_CODE, got $actual_version_code" >&2
            exit 1
          fi
          if [ "$actual_version_name" != "$EXPECTED_VERSION_NAME" ]; then
            echo "Android versionName mismatch: expected $EXPECTED_VERSION_NAME, got $actual_version_name" >&2
            exit 1
          fi
          apksigner_path=$(command -v apksigner || true)
          if [ -z "$apksigner_path" ]; then
            apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$apksigner_path" ] || [ ! -x "$apksigner_path" ]; then
            echo "No apksigner found"; exit 1
          fi
          "$apksigner_path" verify --verbose "$apk"
          version="$RELEASE_TAG"
          version="${version#v}"
          cp "$apk" "glacier-eq_v${version}_android-arm64.apk"
          echo "APK: glacier-eq_v${version}_android-arm64.apk ($(du -h "$apk" | cut -f1))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glacier-eq-android-apk
          path: glacier-eq_v*_android-arm64.apk
          if-no-files-found: error

  release:
    name: Create release and upload assets
    # The builds no longer wait on `verify`, so require it here: this is the
    # single gate that stops a failing tag from publishing.
    needs: [check-tag, verify, desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # OIDC token for the attestation subject, and write access to store the
      # attestations themselves. Both are scoped to this job only.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: glacier-eq-*
          merge-multiple: true

      - name: Verify release asset coverage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Release assets downloaded:"
          find artifacts -maxdepth 1 -type f -print | sort

          require_glob() {
            local label="$1"
            local pattern="$2"
            if ! compgen -G "$pattern" >/dev/null; then
              echo "❌ Missing required release asset: $label ($pattern)"
              exit 1
            fi
          }

          require_glob "Linux DEB" 'artifacts/*.deb'
          require_glob "Linux RPM" 'artifacts/*.rpm'
          require_glob "Linux AppImage" 'artifacts/*.AppImage'
          require_glob "Linux AppImage zsync" 'artifacts/*.AppImage.zsync'
          require_glob "Windows MSI" 'artifacts/*.msi'
          require_glob "Windows EXE" 'artifacts/*.exe'
          require_glob "Windows portable ZIP" 'artifacts/*windows-x64-portable.zip'
          require_glob "macOS Apple Silicon DMG" 'artifacts/*aarch64*.dmg'
          if ! compgen -G 'artifacts/*x64*.dmg' >/dev/null && ! compgen -G 'artifacts/*x86_64*.dmg' >/dev/null; then
            echo "❌ Missing required release asset: macOS Intel DMG"
            exit 1
          fi
          require_glob "Android ARM64 APK" 'artifacts/*android-arm64.apk'
          # The in-app updater only installs signed payloads.
          require_glob "Linux AppImage signature" 'artifacts/*.AppImage.sig'
          require_glob "Windows NSIS signature" 'artifacts/*-setup.exe.sig'
          require_glob "Windows MSI signature" 'artifacts/*.msi.sig'
          require_glob "macOS updater archives" 'artifacts/*macos-*.app.tar.gz.sig'

          echo "✅ All expected OS release assets are present."

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Verify updater asset signatures
        shell: bash
        run: |
          set -euo pipefail
          public_key=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey)')
          public_key=$(printf '%s' "$public_key" | base64 --decode | tail -n 1)
          decoded_signature=$(mktemp)
          trap 'rm -f "$decoded_signature"' EXIT
          shopt -s nullglob
          signatures=(artifacts/*.sig)
          if (( ${#signatures[@]} == 0 )); then
            echo "No updater signatures were downloaded" >&2
            exit 1
          fi
          for signature in "${signatures[@]}"; do
            asset="${signature%.sig}"
            if [[ ! -f "$asset" ]]; then
              echo "Signature has no matching asset: $signature" >&2
              exit 1
            fi
            base64 --decode "$signature" > "$decoded_signature"
            minisign -Vm "$asset" -x "$decoded_signature" -P "$public_key"
          done

      # Runs after coverage and signature verification so only a complete,
      # cryptographically verified asset set is attested. Users can then verify
      # an installer was built from this repo at this commit with
      # `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/*"

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          TAG_VERSION="${RELEASE_TAG#v}"
          awk -v version="$TAG_VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Automated Glacier EQ build. See assets below for installers." > RELEASE_NOTES.md
          fi

      # latest.json is what installed apps poll at
      # releases/latest/download/latest.json. A draft release is invisible to
      # that URL, so apps pick the update up the moment the draft is published
      # (and never for prereleases, which `latest` skips).
      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.check-tag.outputs.release-version }}
          REPO: ${{ github.repository }}
        run: node scripts/make-update-manifest.mjs artifacts "$RELEASE_VERSION" "$RELEASE_TAG" "$REPO" RELEASE_NOTES.md

      - name: Create release and upload verified assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          name: "Glacier EQ ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          # Keep installers private until the signed upgrade/smoke checks pass.
          # The maintainer publishes the verified draft after those checks.
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
