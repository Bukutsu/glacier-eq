name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Serialize every Pages writer. A tag deployment and a manual deployment
  # must never race for the same production environment.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: '0.15.0'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Manual Pages deployments are restricted to main." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            base_version="${release_version%%-*}"
            package_version="$(node -p "require('./package.json').version")"
            cargo_version="$(sed -n 's/^version = \"\\([^\"]*\\)\"/\\1/p' src-tauri/Cargo.toml | head -1)"
            if [ "$base_version" != "$package_version" ] || [ "$base_version" != "$cargo_version" ]; then
              echo "Tag/package/Cargo version mismatch." >&2
              exit 1
            fi
          fi
          cargo metadata --locked --no-deps
          cargo test --workspace --locked

      - name: Run frontend tests
        run: npm test

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          version_args=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_args=(VITE_APP_VERSION="${GITHUB_REF_NAME#v}")
          fi
          VITE_BASE_PATH=/glacier-eq/ env "${version_args[@]}" npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        continue-on-error: true

      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
