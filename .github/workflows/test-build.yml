name: Test build

# Unsigned Windows build for hardware testers. Runs on pushes to test/**
# branches only; never publishes a release.
on:
  push:
    branches:
      - "test/**"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - run: npm ci
      - run: npx tauri build --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: glacier-eq-windows-test
          path: |
            target/release/bundle/nsis/*.exe
            target/release/*.exe
          if-no-files-found: error
