[package]
name = "glacier-eq"
version = "0.13.0"
description = "Cross-platform parametric EQ editor for USB DACs. Built with Tauri + React + Rust."
license = "GPL-3.0-only"
authors = ["Bukutsu"]
edition = "2021"

[lib]
name = "glacier_eq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-hid = { path = "../tauri-plugin-hid" }
tauri-plugin-material-you = { path = "../tauri-plugin-material-you" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glacier-core = { path = "../glacier-core" }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-clipboard-manager = "2.4.1"
fs2 = "0.4.3"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.3", features = ["linux-native"], default-features = false }
