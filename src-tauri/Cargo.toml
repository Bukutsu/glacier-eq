[package]
name = "glacier-eq"
version = "0.3.0"
description = "Cross-platform parametric EQ editor for USB DACs. Built with Tauri + React + Rust."
license = "GPL-3.0-only"
authors = ["Bukutsu"]
edition = "2021"

[lib]
name = "glacier_eq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-hid = { path = "../tauri-plugin-hid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glacier-core = { path = "../glacier-core" }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-m3 = "0.3.2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2.3.2"


[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.3", features = ["linux-native"], default-features = false }
libc = "0.2"
