[package]
name = "glacier-eq"
version = "0.1.0"
description = "Cross-platform parametric EQ editor for USB DACs. Built with Tauri + React + Rust."
license = "MIT"
authors = ["Bukutsu"]
edition = "2021"

[lib]
name = "glacier_eq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-hid = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glacier-core = { path = "../glacier-core" }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
