[package]
name = "glacier-core"
version = "0.1.1"
edition = "2021"
description = "Core business logic for Glacier EQ — filter math, device protocols, and packet building. UI-agnostic, reusable from Tauri, CLI, or headless services."
license = "GPL-3.0-only"
authors = ["Bukutsu"]

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[lib]
name = "glacier_core"
crate-type = ["cdylib", "rlib"]
