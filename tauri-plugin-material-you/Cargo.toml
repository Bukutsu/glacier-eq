[package]
name = "tauri-plugin-material-you"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Bukutsu"]
description = "Tauri plugin exposing Android Material You (Monet) dynamic colors"
license = "GPL-3.0-only"
links = "tauri-plugin-material-you"
build = "build.rs"

[lib]
name = "tauri_plugin_material_you"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2.4.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.1.0", features = ["build"] }
